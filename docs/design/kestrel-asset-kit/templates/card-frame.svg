<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d3"/>
      <stop offset=".62" stop-color="#eadbb6"/>
      <stop offset="1" stop-color="#cbb88e"/>
    </linearGradient>
    <pattern id="hatch" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
