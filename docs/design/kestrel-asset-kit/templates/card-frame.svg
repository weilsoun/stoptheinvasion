    <rect x="65" y="704" width="630" height="7" fill="var(--card-accent, #e5664f)"/>
    <circle cx="88" cy="85" r="54" fill="#f0c35b" stroke="#07151d" stroke-width="9"/>
  </g>
  <rect x="10" y="10" width="740" height="1060" rx="37" fill="none" stroke="#07151d" stroke-width="18"/>
